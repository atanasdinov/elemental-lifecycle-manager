version: "2"

run:
  timeout: 5m
  allow-parallel-runners: true

linters:
  # don't skip warning about doc comments
  # don't exclude the default set of lint
  # restore some of the defaults
  # (fill in the rest as needed)
  exclusions:
    rules:
      - path: "api/*"
        linters:
          - lll
      - path: "internal/*"
        linters:
          - dupl
          - lll
  default: none
  enable:
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - unused

formatters:
  enable:
    - gofmt
    - goimports
