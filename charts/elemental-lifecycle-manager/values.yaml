replicaCount: 1

image:
  repository: controller
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

healthProbe:
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10

metrics:
  enabled: false
  secure: false
  service:
    name: ""
    type: ClusterIP
    port: 8080
    annotations: {}

webhook:
  enabled: true
  service:
    name: ""
    port: 443
    targetPort: 9443
    annotations: {}
  failurePolicy: Fail

enableHTTP2: false

extraArgs: []
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
