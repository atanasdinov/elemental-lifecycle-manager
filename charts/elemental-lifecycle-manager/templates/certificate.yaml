{{- if include "elemental-lifecycle-manager.useDefaultCert" . }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "elemental-lifecycle-manager.certificateIssuerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elemental-lifecycle-manager.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "elemental-lifecycle-manager.certificateName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elemental-lifecycle-manager.labels" . | nindent 4 }}
spec:
  dnsNames:
    - {{ include "elemental-lifecycle-manager.webhookServiceName" . }}.{{ .Release.Namespace }}.svc
    - {{ include "elemental-lifecycle-manager.webhookServiceName" . }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: {{ include "elemental-lifecycle-manager.certificateIssuerName" . }}
  secretName: {{ include "elemental-lifecycle-manager.certificateSecretName" . }}
{{- end }}
